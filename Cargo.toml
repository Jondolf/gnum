[package]
name = "gnum"
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["Joona Aalto <jondolf.dev@gmail.com>"]
description = "Generic numerics with SIMD and determinism in Rust"
repository = "https://github.com/Jondolf/gnum"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["numerics", "math", "determinism", "simd"]
categories = ["mathematics", "science", "no-std"]

[workspace]
members = ["gimd"]
resolver = "2"

[features]
default = ["std"]

# Use the standard library's math routines instead of portable approximations
std = ["wide?/std"]

# SIMD backends
wide = ["dep:wide"]
portable_simd = []

[dependencies]
wide = { version = "1.7", optional = true, default-features = false }

[dev-dependencies]
gnum = { path = "./", default-features = false, features = [
    "wide",
    "portable_simd",
] }
wide = { version = "1.7" }
