[package]
name = "gnum"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Jondolf/gnum"
readme = "README.md"

[workspace]
members = ["gimd"]
resolver = "2"

[features]
# Support for `core::simd`
portable_simd = []

# Support for `wide`
wide = ["dep:wide"]

[dependencies]
wide = { version = "1.7", optional = true }

[dev-dependencies]
gnum = { path = "./", features = ["portable_simd", "wide"] }
wide = { version = "1.7" }
