[package]
name = "gnum"
version = "0.1.0"
edition = "2024"
authors = ["Joona Aalto <jondolf.dev@gmail.com>"]
description = "Generic numerics with determinism and SIMD in Rust"
repository = "https://github.com/Jondolf/gnum"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["numerics", "math", "determinism", "simd", "wide", "portable-simd"]
categories = ["mathematics", "science", "no-std"]

[workspace]
members = ["gimd"]
resolver = "2"

[features]
default = []

# SIMD backends
wide = ["dep:wide"]
portable_simd = []

[dependencies]
wide = { version = "1.7", optional = true }

[dev-dependencies]
gnum = { path = "./", features = ["wide", "portable_simd"] }
wide = { version = "1.7" }
